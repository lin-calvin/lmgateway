<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Login</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f5f6f8; color: #20242b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(560px, 100%); }
    .card { background: white; border: 1px solid #dfe3e8; border-radius: 14px; padding: 24px; box-shadow: 0 10px 30px #17202b12; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    p { color: #657080; line-height: 1.5; }
    label { display: block; margin: 18px 0 6px; font-size: 13px; font-weight: 650; }
    input { width: 100%; border: 1px solid #c8ced8; border-radius: 8px; padding: 10px 12px; font: inherit; }
    button, a.button { display: inline-block; border: 0; border-radius: 8px; padding: 10px 14px; margin: 14px 8px 0 0; font: inherit; font-weight: 650; cursor: pointer; text-decoration: none; }
    button.primary, a.button { background: #2457c5; color: white; }
    button.secondary { background: #e9edf3; color: #26364c; }
    button.danger { background: #fff0ef; color: #a52b25; }
    pre { min-height: 48px; white-space: pre-wrap; word-break: break-word; background: #f0f2f5; border-radius: 8px; padding: 12px; margin: 18px 0 0; font-size: 12px; }
    .status { margin-top: 16px; padding: 12px; border-radius: 8px; background: #eef7ef; color: #216b32; }
    .muted { font-size: 12px; color: #7b8490; }
  </style>
</head>
<body>
<main>
  <section class="card">
    <h1>Codex Login</h1>
    <p>Authenticate this gateway with a ChatGPT subscription. This page only manages login status; the full gateway UI will be designed later.</p>

    <label for="key">Gateway API key</label>
    <input id="key" type="password" autocomplete="off" placeholder="Optional when auth is disabled">
    <button class="secondary" id="save">Save key</button>
    <button class="secondary" id="status">Check status</button>

    <div id="statusBox" class="status">Not checked</div>

    <button class="primary" id="device">Device login</button>
    <button class="secondary" id="poll" disabled>Poll device login</button>
    <button class="danger" id="logout">Logout</button>

    <pre id="output">Ready.</pre>
    <div class="muted">The access and refresh tokens are never rendered here.</div>
  </section>
</main>
<script>
  const keyInput = document.querySelector('#key')
  const output = document.querySelector('#output')
  const statusBox = document.querySelector('#statusBox')
  const pollButton = document.querySelector('#poll')
  let deviceRequestId = ''
  keyInput.value = localStorage.getItem('lmgateway.apiKey') || ''

  function headers(json) {
    const h = json ? {'Content-Type': 'application/json'} : {}
    const key = keyInput.value.trim()
    if (key) h.Authorization = `Bearer ${key}`
    return h
  }

  async function call(path, options = {}) {
    const response = await fetch(path, {...options, headers: {...headers(Boolean(options.body)), ...(options.headers || {})}})
    const text = await response.text()
    let data
    try { data = JSON.parse(text) } catch { data = text }
    if (!response.ok) throw new Error(`${response.status}: ${typeof data === 'string' ? data : JSON.stringify(data)}`)
    return data
  }

  function show(value) { output.textContent = typeof value === 'string' ? value : JSON.stringify(value, null, 2) }

  document.querySelector('#save').onclick = () => {
    localStorage.setItem('lmgateway.apiKey', keyInput.value.trim())
    show('Gateway key saved in this browser.')
  }

  document.querySelector('#status').onclick = async () => {
    try {
      const data = await call('/api/action/codex/status')
      statusBox.textContent = data.authenticated ? `Authenticated${data.account_id ? `: ${data.account_id}` : ''}` : 'Not authenticated'
      show(data)
    } catch (error) { statusBox.textContent = 'Request failed'; show(String(error)) }
  }

  document.querySelector('#device').onclick = async () => {
    try {
      const data = await call('/api/action/codex/login/device/start', {method: 'POST'})
      deviceRequestId = data.request_id || ''
      pollButton.disabled = !deviceRequestId
      show(data)
      if (data.verification_url) window.open(data.verification_url, '_blank', 'noopener,noreferrer')
    } catch (error) { show(String(error)) }
  }

  document.querySelector('#poll').onclick = async () => {
    if (!deviceRequestId) return
    try {
      const data = await call('/api/action/codex/login/device/poll', {
        method: 'POST', body: JSON.stringify({request_id: deviceRequestId})
      })
      show(data)
      if (data.status === 'authenticated') {
        pollButton.disabled = true
        document.querySelector('#status').click()
      }
    } catch (error) { show(String(error)) }
  }

  document.querySelector('#logout').onclick = async () => {
    try { show(await call('/api/action/codex/logout', {method: 'POST'})); document.querySelector('#status').click() }
    catch (error) { show(String(error)) }
  }
</script>
</body>
</html>
